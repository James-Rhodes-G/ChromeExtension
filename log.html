</head>
  <body class="container">
    <main role="main" id="main">
      <!-- Top row to display Logo and Title -->
      <div class="row flush">
        <!-- Left Gutter -->
        <div class="col-sm-1">
          <div class="logoContainer right">
            <a class="brand">
              <img class="center" src="./ExtensionLogo/adaptive-g-orange_32.png" alt="Genesys Logo">
            </a>
          </div>
        </div>
        <!-- Center of Page -->
         <div class="col-sm-10">
          <h1 class="heavy herotype middle">Genesys PS Tools</h1>
         </div>
        <!-- Right Gutter -->
         <div class="col-sm-1">

         </div>
      </div>
      <!-- Middle row to display Tables and informaiton -->
      <div class="row flush">
        <!-- Left Gutter -->
        <div class="col-sm-1">
          <div class="plus"></div>
        </div>
        <!-- Center of Page -->
        <div class="col-sm-10">
          <h2 class=" heavy hero">Log Entries</h2>
         </div>
        <!-- Right Gutter -->
         <div class="col-sm-1">
          <gux-button id="floatBtn" class="top" accent="tertiary" title="Go to top">Top</button>
         </div>
      </div>
      <div class="row flush">
        <!-- Left Gutter Row 3 -->
        <div class="col-sm-1">
        </div>
        <!-- Center Row 3 -->
        <div class="col-sm-10">
          <div>
              <gux-modal id="example1" size="small">
                <div slot="title">Modal Title</div>
                <div slot="content">This contains the modal content.</div>
                <gux-cta-group slot="footer" align="end">
                  <gux-button id="modalOk" slot="primary">Ok</gux-button>
                  <gux-button id="modalStop" slot="secondary">Stop</gux-button>
                </gux-cta-group>
                </gux-modal>
          </div>
          <div id="logOutput"></div>
          <div><gux-button id="floatBtn" class="bottom" accent="tertiary" title="Go to top">Bottom</button></div>
          
        </div>
        <!-- Right Gutter Row 3 -->
        <div class="col-sm-1">
          <div class="" id="rightGutter"></div>
          <gux-button id="floatBtn" class="bottom" accent="tertiary" title="Go to top">Bottom</button>
        </div>
      </div>
      <!-- Bottom row for buttons etc -->
      <div class="row">
        <!-- Left Gutter -->
        <div class="col-sm-1">
        </div>
        <!-- Center of Page -->
        <div class="col-sm-10">
          <div class="FooterContainer">
            <div class="exportButton" id="exportButton" style="display:none">
              <gux-button accent="secondary" id="export" type="button">Export</button></div>
          </div>
         </div>
        <!-- Right Gutter -->
         <div class="col-sm-1">
         </div>
      </div>

      </div>
